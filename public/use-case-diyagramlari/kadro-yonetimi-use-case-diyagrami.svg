<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1680 1120" role="img" aria-labelledby="title description">
  <title id="title">Kadro Yönetimi Portalı Kullanım Senaryosu Diyagramı</title>
  <desc id="description">Üç sistem rolünün ve sekiz kullanım senaryosunun gösterildiği, hedef kimlik doğrulama entegrasyonunun henüz uygulanmadığını belirten genel UML kullanım senaryosu diyagramı.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#123d68"/><stop offset="1" stop-color="#2477ae"/></linearGradient>
    <linearGradient id="surface" x1="0" x2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf7fb"/></linearGradient>
    <linearGradient id="boundary" x1="0" x2="1"><stop offset="0" stop-color="#e5f6ff"/><stop offset="1" stop-color="#d8f1fb"/></linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#1478e5" stroke-width="1.8"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#13976c" stroke-width="1.8"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#e69a16" stroke-width="1.8"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#d94565" stroke-width="1.8"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#079caf" stroke-width="1.8"/></marker>
    <style>
      text{font-family:Arial,"Helvetica Neue",sans-serif;fill:#18324b}
      .title{font-size:37px;font-weight:700;fill:#fff}
      .system-name{font-size:28px;font-weight:700;fill:#0755b8}
      .actor-label{font-size:18px;font-weight:700}
      .actor-sub{font-size:14px;fill:#526b81}
      .use-title{font-size:18px;font-weight:700;fill:#064fae}
      .use-label{font-size:16px;font-weight:600;fill:#183b5a}
      .note{font-size:15px;fill:#465f74}
      .legend{font-size:15px;fill:#174872}
      .small{font-size:13px;fill:#60758a}
      .assoc{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
    </style>
  </defs>
  <rect width="1680" height="1120" fill="url(#surface)"/>
  <path d="M0 0h1680v88H0z" fill="url(#header)"/>
  <text x="38" y="57" class="title">Kadro Yönetimi Portalı Kullanım Senaryosu (Use Case) Diyagramı</text>

  <!-- System boundary -->
  <rect x="360" y="120" width="1010" height="815" rx="20" fill="url(#boundary)" stroke="#079cff" stroke-width="4"/>
  <text x="855" y="162" text-anchor="middle" class="system-name">KADRO YÖNETİMİ PORTALI</text>

  <!-- Associations: the general portal user can access the shared capabilities. -->
  <path class="assoc" stroke="#1478e5" marker-end="url(#arrow-blue)" d="M239 210 C280 210 325 245 375 252"/>
  <path class="assoc" stroke="#1478e5" marker-end="url(#arrow-blue)" d="M239 203 C365 150 565 150 700 245"/>

  <!-- HR specialist's request and review responsibilities. -->
  <path class="assoc" stroke="#13976c" marker-end="url(#arrow-green)" d="M247 398 C330 398 365 428 425 428"/>
  <path class="assoc" stroke="#13976c" marker-end="url(#arrow-green)" d="M247 401 C432 350 700 350 875 428"/>
  <path class="assoc" stroke="#13976c" marker-end="url(#arrow-green)" d="M247 403 C325 505 350 618 425 618"/>
  <path class="assoc" stroke="#13976c" marker-end="url(#arrow-green)" d="M247 406 C455 510 825 540 875 618"/>

  <!-- HR manager participates in requests and approves their outcome. -->
  <path class="assoc" stroke="#e69a16" marker-end="url(#arrow-amber)" d="M247 598 C300 548 345 456 425 456"/>
  <path class="assoc" stroke="#e69a16" marker-end="url(#arrow-amber)" d="M247 601 C430 540 660 456 875 456"/>
  <path class="assoc" stroke="#e69a16" marker-end="url(#arrow-amber)" d="M247 604 C315 650 350 646 425 646"/>
  <path class="assoc" stroke="#e69a16" marker-end="url(#arrow-amber)" d="M247 606 C465 700 700 646 875 646"/>

  <!-- Administrator responsibilities. -->
  <path class="assoc" stroke="#d94565" marker-end="url(#arrow-rose)" d="M247 798 C370 812 520 850 680 850"/>

  <!-- UC-01 and UC-02 -->
  <ellipse cx="520" cy="252" rx="145" ry="62" fill="#eaf6ff" fill-opacity=".96" stroke="#1684eb" stroke-width="2.4"/>
  <text x="520" y="245" text-anchor="middle" class="use-title">UC-01</text>
  <text x="520" y="272" text-anchor="middle" class="use-label">Erişim ve rol görünümü</text>
  <ellipse cx="850" cy="252" rx="150" ry="62" fill="#eaf6ff" fill-opacity=".96" stroke="#1684eb" stroke-width="2.4"/>
  <text x="850" y="245" text-anchor="middle" class="use-title">UC-02</text>
  <text x="850" y="272" text-anchor="middle" class="use-label">Kadro arama ve listeleme</text>

  <!-- Request and approval use cases -->
  <ellipse cx="590" cy="442" rx="170" ry="62" fill="#fff" fill-opacity=".96" stroke="#1684eb" stroke-width="2.4"/>
  <text x="590" y="435" text-anchor="middle" class="use-title">UC-03</text>
  <text x="590" y="462" text-anchor="middle" class="use-label">Personel atama talebi</text>
  <ellipse cx="1050" cy="442" rx="180" ry="62" fill="#eaf6ff" fill-opacity=".96" stroke="#1684eb" stroke-width="2.4"/>
  <text x="1050" y="435" text-anchor="middle" class="use-title">UC-04</text>
  <text x="1050" y="462" text-anchor="middle" class="use-label">Kadro bloke talebi</text>
  <ellipse cx="590" cy="632" rx="170" ry="62" fill="#fff" fill-opacity=".96" stroke="#1684eb" stroke-width="2.4"/>
  <text x="590" y="625" text-anchor="middle" class="use-title">UC-05</text>
  <text x="590" y="652" text-anchor="middle" class="use-label">Derece değişikliği talebi</text>
  <ellipse cx="1050" cy="632" rx="180" ry="62" fill="#eaf6ff" fill-opacity=".96" stroke="#1684eb" stroke-width="2.4"/>
  <text x="1050" y="625" text-anchor="middle" class="use-title">UC-06</text>
  <text x="1050" y="652" text-anchor="middle" class="use-label">Onay ve karar geçmişi</text>

  <!-- Administration and reporting -->
  <ellipse cx="850" cy="822" rx="170" ry="62" fill="#eaf6ff" fill-opacity=".96" stroke="#1684eb" stroke-width="2.4"/>
  <text x="850" y="815" text-anchor="middle" class="use-title">UC-07</text>
  <text x="850" y="842" text-anchor="middle" class="use-label">Sistem parametreleri</text>
  <ellipse cx="1190" cy="252" rx="145" ry="62" fill="#eaf6ff" fill-opacity=".96" stroke="#1684eb" stroke-width="2.4"/>
  <text x="1190" y="245" text-anchor="middle" class="use-title">UC-08</text>
  <text x="1190" y="267" text-anchor="middle" class="use-label">Raporlama ve sorumluluk</text>
  <text x="1190" y="290" text-anchor="middle" class="small">İK Sorumlusu · İK Müdürü · Admin</text>

  <!-- Role actors -->
  <g aria-label="Portal kullanıcı aktörü" stroke="#1478e5" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="116" cy="173" r="13" fill="#fff"/>
    <path d="M116 186v43m0-30-20 13m20-13 20 13m-20 17-19 24m19-24 19 24"/>
  </g>
  <text x="116" y="274" text-anchor="middle" class="actor-label" fill="#0755b8">Portal Kullanıcısı</text>
  <text x="116" y="296" text-anchor="middle" class="actor-sub">(ortak rol)</text>

  <g aria-label="İK Sorumlusu aktörü" stroke="#13976c" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="116" cy="361" r="13" fill="#fff"/>
    <path d="M116 374v43m0-30-20 13m20-13 20 13m-20 17-19 24m19-24 19 24"/>
  </g>
  <text x="116" y="466" text-anchor="middle" class="actor-label" fill="#087750">İK Sorumlusu</text>
  <text x="116" y="488" text-anchor="middle" class="actor-sub">Talep oluşturma ve takip</text>

  <g aria-label="İK Müdürü aktörü" stroke="#e69a16" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="116" cy="561" r="13" fill="#fff"/>
    <path d="M116 574v43m0-30-20 13m20-13 20 13m-20 17-19 24m19-24 19 24"/>
  </g>
  <text x="116" y="666" text-anchor="middle" class="actor-label" fill="#a96b06">İK Müdürü</text>
  <text x="116" y="688" text-anchor="middle" class="actor-sub">Talep inceleme ve karar</text>

  <g aria-label="Admin aktörü" stroke="#d94565" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="116" cy="761" r="13" fill="#fff"/>
    <path d="M116 774v43m0-30-20 13m20-13 20 13m-20 17-19 24m19-24 19 24"/>
  </g>
  <text x="116" y="866" text-anchor="middle" class="actor-label" fill="#b72c4b">Admin</text>
  <text x="116" y="888" text-anchor="middle" class="actor-sub">Parametre yönetimi</text>

  <!-- External identity dependency is shown as a target, not an existing integration. -->
  <rect x="1380" y="174" width="270" height="188" rx="14" fill="#fff" stroke="#079caf" stroke-width="2.5"/>
  <rect x="1380" y="174" width="270" height="48" rx="14" fill="#e8f8fa"/>
  <path d="M1380 210v12h270v-12" fill="#e8f8fa"/>
  <ellipse cx="1420" cy="264" rx="22" ry="8" fill="#07889c"/>
  <path d="M1398 264v40c0 5 10 9 22 9s22-4 22-9v-40" fill="#07889c"/>
  <ellipse cx="1420" cy="277" rx="22" ry="8" fill="#12a2b3"/>
  <ellipse cx="1420" cy="290" rx="22" ry="8" fill="#07889c"/>
  <circle cx="1434" cy="277" r="2.5" fill="#fff"/><circle cx="1434" cy="290" r="2.5" fill="#fff"/>
  <text x="1460" y="205" font-size="18" font-weight="700" fill="#08788d">KİMLİK KAYNAĞI</text>
  <text x="1460" y="260" class="note">Gerçek kullanıcı hesabı</text>
  <text x="1460" y="284" class="note">ve rol doğrulama / SSO</text>
  <rect x="1400" y="319" width="224" height="27" rx="13" fill="#fff4dc" stroke="#e6ad43"/>
  <text x="1512" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#83580b">HEDEF · HENÜZ ENTEGRE DEĞİL</text>
  <path d="M1380 276 C1340 190 1370 105 1300 105 H375 V252" fill="none" stroke="#079caf" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow-cyan)"/>
  <text x="1250" y="203" text-anchor="middle" class="small">hedef entegrasyon</text>

  <!-- Legend -->
  <rect x="24" y="990" width="1632" height="98" rx="15" fill="#fff" fill-opacity=".86" stroke="#8dd8ff" stroke-width="1.8"/>
  <text x="48" y="1022" font-size="16" font-weight="700" fill="#16466f">AKTÖRLER</text>
  <circle cx="70" cy="1050" r="9" fill="#fff" stroke="#1478e5" stroke-width="3"/><path d="M70 1059v16m0-10-9 7m9-7 9 7m-9 3-8 9m8-9 8 9" stroke="#1478e5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="91" y="1060" class="legend">Portal kullanıcısı</text>
  <path d="M274 1054h53" stroke="#13976c" stroke-width="4"/><circle cx="300" cy="1054" r="7" fill="#fff" stroke="#13976c" stroke-width="3"/><text x="337" y="1060" class="legend">İK Sorumlusu</text>
  <path d="M470 1054h53" stroke="#e69a16" stroke-width="4"/><circle cx="496" cy="1054" r="7" fill="#fff" stroke="#e69a16" stroke-width="3"/><text x="533" y="1060" class="legend">İK Müdürü</text>
  <path d="M650 1054h53" stroke="#d94565" stroke-width="4"/><circle cx="676" cy="1054" r="7" fill="#fff" stroke="#d94565" stroke-width="3"/><text x="713" y="1060" class="legend">Admin</text>
  <rect x="830" y="1038" width="54" height="35" rx="8" fill="url(#boundary)" stroke="#079cff" stroke-width="2.5"/><text x="895" y="1060" class="legend">Sistem sınırı</text>
  <ellipse cx="1060" cy="1055" rx="29" ry="17" fill="#edf8ff" stroke="#1684eb" stroke-width="2"/><text x="1100" y="1060" class="legend">Kullanım senaryosu</text>
  <path d="M1308 1054h55" stroke="#079caf" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-cyan)"/><text x="1373" y="1050" class="legend">Dış sistem /</text><text x="1373" y="1072" class="legend">hedef entegrasyon</text>
</svg>
