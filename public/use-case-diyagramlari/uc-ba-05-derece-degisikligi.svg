<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 820" role="img" aria-labelledby="title desc"><title id="title">UC-05 — Kadro derece değişikliği talebi</title><desc id="desc">İK Sorumlusu kadroyu ve yeni dereceyi belirler, bilgileri doğrular ve değişiklik talebini onaya gönderir.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><style>text{font-family:Arial,'Helvetica Neue',sans-serif;fill:#18324b}.label{font-size:15px}.small{font-size:13px;fill:#60758a;paint-order:stroke;stroke:#f7fafc;stroke-width:5px;stroke-linejoin:round}.use{fill:#fff;stroke:#18324b;stroke-width:2}.primary{fill:#e7f4f3;stroke:#0e7c7b;stroke-width:3}.rel{stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.actor{stroke:#18324b;stroke-width:3;fill:none;stroke-linecap:round}.caption{font-size:13px;fill:#0e7c7b;font-weight:bold}</style></defs><rect width="1520" height="820" fill="#fff"/><text x="64" y="52" class="caption" letter-spacing="2">KADRO YÖNETİMİ · KULLANIM SENARYOSU</text><text x="64" y="104" font-size="30" font-weight="700">UC-05 — Kadro derece değişikliği talebi</text><rect x="350" y="145" width="875" height="620" rx="20" fill="#f7fafc" stroke="#c9d7e2" stroke-width="2"/><text x="382" y="183" font-size="15" font-weight="700" fill="#526b80">KADRO YÖNETİMİ UYGULAMASI</text><g class="actor"><circle cx="164" cy="330" r="22"/><path d="M164 352v72m-39-43h78m-39 43-31 46m31-46 31 46"/></g><text x="164" y="497" text-anchor="middle" font-size="16" font-weight="700">İK Sorumlusu</text><text x="164" y="520" text-anchor="middle" class="small">Derece talebini hazırlar</text><path d="M203 388 615 310" stroke="#18324b" stroke-width="2.4" fill="none"/><path class="rel" d="M765 369 640 468"/><path class="rel" d="M815 369 960 468"/><path class="rel" d="M790 370v235"/><text x="680" y="415" class="small">«include»</text><text x="902" y="415" class="small">«include»</text><text x="790" y="432" text-anchor="middle" class="small">«include»</text><ellipse class="primary" cx="790" cy="300" rx="185" ry="68"/><text x="790" y="294" text-anchor="middle" font-size="19" font-weight="700"><tspan x="790">Kadro derece</tspan><tspan x="790" dy="25">değişikliği talep et</tspan></text><ellipse class="use" cx="590" cy="515" rx="170" ry="52"/><text x="590" y="510" text-anchor="middle" class="label"><tspan x="590">Değiştirilecek</tspan><tspan x="590" dy="21">kadroyu seç</tspan></text><ellipse class="use" cx="1000" cy="515" rx="170" ry="52"/><text x="1000" y="510" text-anchor="middle" class="label"><tspan x="1000">Mevcut ve yeni</tspan><tspan x="1000" dy="21">dereceyi doğrula</tspan></text><ellipse class="use" cx="790" cy="665" rx="190" ry="49"/><text x="790" y="660" text-anchor="middle" class="label"><tspan x="790">Değişiklik talebini</tspan><tspan x="790" dy="21">İK Müdürü onayına gönder</tspan></text><text x="64" y="798" class="small">Yeni derece bilgisi talep olarak kaydedilir; kadro kaydı karar sonrasında güncellenir.</text></svg>
