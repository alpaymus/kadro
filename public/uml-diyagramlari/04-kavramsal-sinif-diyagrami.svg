<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
<title id="title">İK Yönetim Sistemi — UML Kavramsal Sınıf Diyagramı</title><desc id="desc">Analiz düzeyindeki sınıflar Kullanıcı, Rol, soyut Talep, Kadro, Karar ve DenetimKaydı; talep türlerinin kalıtımı, ilişkiler ve çokluklar.</desc>
<defs><marker id="gen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 7L12 1L12 13Z" fill="#fff" stroke="#34536f" stroke-width="1.5"/></marker><style>.bg{fill:#f5f8fc}.cls{fill:#fff;stroke:#246b91;stroke-width:1.7}.hdr{fill:#eaf3fb;stroke:#246b91;stroke-width:1.7}.head{font:700 25px Arial,sans-serif;fill:#18324b}.sub{font:15px Arial,sans-serif;fill:#52657a}.name{font:700 16px Arial,sans-serif;fill:#18324b}.attr{font:14px Arial,sans-serif;fill:#18324b}.small{font:13px Arial,sans-serif;fill:#52657a}.rel{stroke:#52657a;stroke-width:1.5;fill:none}.gen{stroke:#34536f;stroke-width:1.6;fill:none;marker-end:url(#gen)}.line{stroke:#52657a;stroke-width:1.4}.multi{font:13px Arial,sans-serif;fill:#18324b}</style></defs>
<rect class="bg" width="1800" height="1040"/><text class="head" x="55" y="52">İK Yönetim Sistemi · Kavramsal sınıf diyagramı</text><text class="sub" x="55" y="80">UML 2.5.1 · Analiz modeli; uygulama / veritabanı şeması değildir</text>
<!-- Associations -->
<g class="rel"><path d="M195 330V400"/><path d="M340 245H450V390H550"/><path d="M850 385H1030V255H1350"/><path d="M850 450H1120V455H1350"/><path d="M850 500H1320V750H1450"/></g>
<!-- User -->
<g><rect class="cls" x="50" y="180" width="290" height="150"/><path class="hdr" d="M50 180H340V219H50Z"/><text class="name" x="195" y="206" text-anchor="middle">Kullanıcı</text><path class="line" d="M50 219H340"/><text class="attr" x="67" y="245">userId: Kimlik</text><text class="attr" x="67" y="269">kullanıcıAdı: Metin</text><text class="attr" x="67" y="293">durum: HesapDurumu</text><text class="attr" x="67" y="317">+ kimlikDoğrula()</text></g>
<!-- Role -->
<g><rect class="cls" x="50" y="400" width="290" height="132"/><path class="hdr" d="M50 400H340V439H50Z"/><text class="name" x="195" y="426" text-anchor="middle">Rol</text><path class="line" d="M50 439H340"/><text class="attr" x="67" y="465">rolId: Kimlik</text><text class="attr" x="67" y="489">ad: RolAdı</text><text class="small" x="67" y="514">İK Sorumlusu | İK Müdürü | Admin</text></g>
<!-- Abstract request -->
<g><rect class="cls" x="550" y="350" width="300" height="180"/><path class="hdr" d="M550 350H850V389H550Z"/><text class="name" x="700" y="376" text-anchor="middle" font-style="italic">«abstract» Talep</text><path class="line" d="M550 389H850"/><text class="attr" x="568" y="415">talepId: Kimlik</text><text class="attr" x="568" y="439">durum: TalepDurumu</text><text class="attr" x="568" y="463">oluşturulmaZamanı: TarihSaat</text><text class="attr" x="568" y="487">+ gönder()</text><text class="attr" x="568" y="511">+ kararKaydet()</text></g>
<!-- Position -->
<g><rect class="cls" x="1350" y="170" width="340" height="180"/><path class="hdr" d="M1350 170H1690V209H1350Z"/><text class="name" x="1520" y="196" text-anchor="middle">Kadro</text><path class="line" d="M1350 209H1690"/><text class="attr" x="1368" y="235">kadroId: Kimlik</text><text class="attr" x="1368" y="259">birim, ünvan: Metin</text><text class="attr" x="1368" y="283">derece: Tamsayı</text><text class="attr" x="1368" y="307">boş / dolu miktar: Tamsayı</text><text class="attr" x="1368" y="331">+ kapasiteDoğrula()</text></g>
<!-- Decision -->
<g><rect class="cls" x="1350" y="400" width="340" height="150"/><path class="hdr" d="M1350 400H1690V439H1350Z"/><text class="name" x="1520" y="426" text-anchor="middle">Karar</text><path class="line" d="M1350 439H1690"/><text class="attr" x="1368" y="465">sonuç: Onay | Ret</text><text class="attr" x="1368" y="489">kararZamanı: TarihSaat</text><text class="attr" x="1368" y="513">gerekçe: Metin [0..1]</text><text class="attr" x="1368" y="537">kararVeren: Kullanıcı</text></g>
<!-- Audit -->
<g><rect class="cls" x="1450" y="680" width="280" height="145"/><path class="hdr" d="M1450 680H1730V719H1450Z"/><text class="name" x="1590" y="706" text-anchor="middle">DenetimKaydı</text><path class="line" d="M1450 719H1730"/><text class="attr" x="1467" y="745">olayTürü: Metin</text><text class="attr" x="1467" y="769">zaman: TarihSaat</text><text class="attr" x="1467" y="793">aktörId, nesneId: Kimlik</text><text class="attr" x="1467" y="817">değişiklik özeti: Metin</text></g>
<!-- Four concrete request types -->
<g><rect class="cls" x="300" y="700" width="230" height="140"/><path class="hdr" d="M300 700H530V739H300Z"/><text class="name" x="415" y="726" text-anchor="middle">KadroTalebi</text><path class="line" d="M300 739H530"/><text class="attr" x="316" y="765">işlemTürü: Kadroİşlemi</text><text class="attr" x="316" y="789">değişiklikÖzeti: Metin</text><text class="attr" x="316" y="813">+ doğrula()</text></g>
<g><rect class="cls" x="560" y="700" width="230" height="140"/><path class="hdr" d="M560 700H790V739H560Z"/><text class="name" x="675" y="726" text-anchor="middle">AtamaTalebi</text><path class="line" d="M560 739H790"/><text class="attr" x="576" y="765">personelNo: Metin</text><text class="attr" x="576" y="789">atamaTarihi: Tarih</text><text class="attr" x="576" y="813">atamaTürü: Metin</text></g>
<g><rect class="cls" x="820" y="700" width="230" height="140"/><path class="hdr" d="M820 700H1050V739H820Z"/><text class="name" x="935" y="726" text-anchor="middle">BlokeTalebi</text><path class="line" d="M820 739H1050"/><text class="attr" x="836" y="765">miktar: PozitifTamsayı</text><text class="attr" x="836" y="789">işlemTarihi: Tarih</text><text class="attr" x="836" y="813">gerekçe: Metin</text></g>
<g><rect class="cls" x="1080" y="700" width="230" height="140"/><path class="hdr" d="M1080 700H1310V739H1080Z"/><text class="name" x="1195" y="726" text-anchor="middle">DereceTalebi</text><path class="line" d="M1080 739H1310"/><text class="attr" x="1096" y="765">mevcutDerece: Tamsayı</text><text class="attr" x="1096" y="789">yeniDerece: Tamsayı</text><text class="attr" x="1096" y="813">işlemTarihi: Tarih</text></g>
<!-- Generalization: concrete requests point to abstract Request. -->
<g class="gen"><path d="M415 700V620H700V530"/><path d="M675 700V620H700V530"/><path d="M935 700V620H700V530"/><path d="M1195 700V620H700V530"/></g>
<g class="multi"><text x="205" y="348">0..*</text><text x="205" y="394">1</text><text x="348" y="238">1</text><text x="518" y="385">0..*</text><text x="865" y="377">0..*</text><text x="1322" y="250">0..1</text><text x="865" y="442">1</text><text x="1322" y="448">0..1</text><text x="865" y="493">1</text><text x="1422" y="743">0..*</text></g>
<text class="small" x="55" y="900">İlişkiler: Her kullanıcıya bir rol atanır; kullanıcı 0..* talep oluşturur. Talep 0..1 kadro ve 0..1 karar ile ilişkilidir; bir talep 0..* denetim kaydı üretir.</text><text class="small" x="55" y="925">Not: Çokluklar analiz varsayımıdır. Yetki, personel ana verisi ve karar saklama ayrıntıları iş sahibi onayıyla kesinleştirilmelidir.</text>
</svg>
