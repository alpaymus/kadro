<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
<title id="title">UC-01 Giriş — UML Sıralama Diyagramı</title><desc id="desc">Kullanıcı adı ve parola ile girişte arayüz, kimlik doğrulama servisi, kullanıcı deposu ve oturum servisi arasındaki mesajlar. Alt birleşik parça başarılı ve başarısız alternatif akışları gösterir.</desc>
<defs><marker id="msg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#34536f" stroke-width="1.5"/></marker><marker id="ret" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#718297" stroke-width="1.5"/></marker><style>.bg{fill:#f5f8fc}.head{font:700 25px Arial,sans-serif;fill:#18324b}.sub{font:15px Arial,sans-serif;fill:#52657a}.box{fill:#eaf3fb;stroke:#246b91;stroke-width:1.7}.lifeline{stroke:#9aabba;stroke-width:1.4;stroke-dasharray:7 6}.act{fill:#b9d8eb;stroke:#246b91;stroke-width:1.2}.msg{stroke:#34536f;stroke-width:1.6;marker-end:url(#msg)}.reply{stroke:#718297;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#ret)}.txt{font:15px Arial,sans-serif;fill:#18324b}.small{font:13px Arial,sans-serif;fill:#52657a}.frame{fill:none;stroke:#52657a;stroke-width:1.6}.framehead{fill:#eaf3fb;stroke:#52657a;stroke-width:1.3}.divider{stroke:#52657a;stroke-width:1.3;stroke-dasharray:6 4}</style></defs>
<rect class="bg" width="1500" height="950"/><text class="head" x="55" y="52">UC-01 · Kullanıcı adı ve şifre ile giriş</text><text class="sub" x="55" y="80">UML 2.5.1 · Sıralama diyagramı · «alt» başarı / hata etkileşimi</text>
<g class="box"><rect x="55" y="115" width="205" height="70" rx="6"/><rect x="340" y="115" width="205" height="70" rx="6"/><rect x="625" y="115" width="205" height="70" rx="6"/><rect x="910" y="115" width="205" height="70" rx="6"/><rect x="1195" y="115" width="205" height="70" rx="6"/></g>
<g class="txt" text-anchor="middle"><text x="157" y="145">Kullanıcı</text><text class="small" x="157" y="166">«actor»</text><text x="442" y="145">Giriş arayüzü</text><text class="small" x="442" y="166">«boundary»</text><text x="727" y="145">Kimlik doğrulama</text><text class="small" x="727" y="166">«control»</text><text x="1012" y="145">Kullanıcı deposu</text><text class="small" x="1012" y="166">«entity»</text><text x="1297" y="145">Oturum servisi</text><text class="small" x="1297" y="166">«control»</text></g>
<g class="lifeline"><path d="M157 185V900"/><path d="M442 185V900"/><path d="M727 185V900"/><path d="M1012 185V900"/><path d="M1297 185V900"/></g>
<!-- Combined fragment surrounds both alternative outcomes. -->
<rect class="frame" x="300" y="320" width="1100" height="510"/><rect class="framehead" x="300" y="320" width="72" height="28"/><text class="txt" x="312" y="340">alt</text><path class="divider" d="M300 610H1400"/>
<g class="act"><rect x="436" y="222" width="12" height="630"/><rect x="721" y="284" width="12" height="530"/><rect x="1006" y="378" width="12" height="72"/><rect x="1291" y="504" width="12" height="80"/></g>
<g class="msg"><path d="M157 228H436"/><path d="M448 282H721"/><path d="M733 375H1006"/><path d="M733 500H1291"/><path d="M733 570H448"/><path d="M733 700H448"/></g>
<g class="reply"><path d="M1006 414H733"/><path d="M1291 544H733"/><path d="M721 590H448"/><path d="M721 750H448"/><path d="M436 870H157"/></g>
<g class="txt"><text x="297" y="219" text-anchor="middle">kullanıcıAdı ve parola gir</text><text x="585" y="273" text-anchor="middle">giriş isteği gönder()</text><text x="870" y="366" text-anchor="middle">aktif hesabı ve parola özetini doğrula()</text><text x="870" y="407" text-anchor="middle">hesap durumu, rol</text><text x="1010" y="491" text-anchor="middle">güvenli oturum oluştur(kullanıcı, rol)</text><text x="585" y="562" text-anchor="middle">role uygun iş masasına yönlendir()</text><text x="585" y="692" text-anchor="middle">genel hata mesajı göster()</text><text x="585" y="585" text-anchor="middle">başarılı oturum</text><text x="585" y="745" text-anchor="middle">kimlik doğrulanamadı</text><text x="296" y="861" text-anchor="middle">giriş sonucu</text></g>
<text class="small" x="380" y="350">[hesap aktif ve kimlik bilgileri doğru]</text><text class="small" x="380" y="638">[kimlik bilgileri yanlış veya hesap pasif]</text>
<text class="small" x="55" y="925">Güvenlik: parola açık metin saklanmaz veya loglanmaz; oturum ve rol sunucu tarafında doğrulanır. UC-01 hedef gereksinimdir; prototipte gerçek giriş yoktur.</text>
</svg>
