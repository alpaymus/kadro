<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2480" viewBox="0 0 1600 2480" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Kadro Yönetimi Portalı İş / Süreç Akış Diyagramı</title>
  <desc id="diagram-description">Demo rolüyle portala girişten kadro ve rapor işlemlerine, İK sorumlusu taleplerinden İK müdürünün onay veya red kararına uzanan; idari parametre yönetimi ile prototip sınırlamalarını gösteren süreç diyagramı.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#164873"/><stop offset="1" stop-color="#2878ad"/></linearGradient>
    <linearGradient id="portal" x1="0" x2="1"><stop stop-color="#eef8fd"/><stop offset="1" stop-color="#e4f2fa"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#60758f"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#14805f"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c43d50"/></marker>
    <style>
      text{font-family:Arial,"Helvetica Neue",sans-serif;fill:#20364c}
      .title{font-size:34px;font-weight:700;fill:#fff}
      .subtitle{font-size:15px;fill:#dcebf5}
      .section{font-size:16px;font-weight:700;letter-spacing:.07em;fill:#31526d}
      .step{font-size:17px;font-weight:700}
      .copy{font-size:14px;fill:#435970}
      .small{font-size:12px;fill:#60758a}
      .tiny{font-size:11px;fill:#60758a}
      .connector{fill:none;stroke:#60758f;stroke-width:2.4;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#60758f;stroke-width:2.4}
      .approved{fill:none;stroke:#14805f;stroke-width:2.8;marker-end:url(#arrow-green)}
      .rejected{fill:none;stroke:#c43d50;stroke-width:2.8;marker-end:url(#arrow-red)}
      .dashed{fill:none;stroke:#7388a0;stroke-width:2;stroke-dasharray:9 8;marker-end:url(#arrow)}
      .card{fill:#fff;stroke:#7e92a7;stroke-width:2}
      .blue-card{fill:#edf7fc;stroke:#2673a6;stroke-width:2.4}
      .green-card{fill:#ecfaf3;stroke:#31846b;stroke-width:2.2}
      .red-card{fill:#fff1f2;stroke:#ca5360;stroke-width:2.2}
      .amber-card{fill:#fff8e8;stroke:#bf8a13;stroke-width:2.2}
      .shadow{filter:drop-shadow(0 3px 4px #17324b12)}
    </style>
  </defs>
  <rect width="1600" height="2480" fill="#fff"/>
  <path d="M0 0h1600v90H0z" fill="url(#header)"/>
  <text x="800" y="43" text-anchor="middle" class="title">Kadro Yönetimi Portalı İş / Süreç Akışı</text>
  <text x="800" y="70" text-anchor="middle" class="subtitle">Kadro görüntüleme · Atama / bloke / derece talepleri · Onay · Sistem yönetimi</text>

  <rect x="610" y="116" width="380" height="74" rx="22" fill="#edf5fb" stroke="#3275a8" stroke-width="2.5"/>
  <text x="800" y="145" text-anchor="middle" class="step">Başlangıç</text>
  <text x="800" y="168" text-anchor="middle" class="copy">Kullanıcı demo rolünü seçerek portala girer</text>
  <path class="connector" d="M800 190v42"/>

  <rect x="505" y="242" width="590" height="112" rx="20" fill="#f7fafc" stroke="#71859e" stroke-width="2.2"/>
  <text x="800" y="273" text-anchor="middle" class="step">UC-01 · Erişim ve rol görünümü</text>
  <text x="800" y="299" text-anchor="middle" class="copy">Demo kullanıcı: İK Sorumlusu · İK Müdürü · Admin</text>
  <text x="800" y="323" text-anchor="middle" class="small">Gerçek kimlik doğrulama / SSO bu prototipte uygulanmamıştır.</text>
  <path class="connector" d="M800 354v39"/>

  <rect x="625" y="403" width="350" height="82" rx="18" class="blue-card"/>
  <text x="800" y="435" text-anchor="middle" class="step">Kadro Yönetimi Portalı</text>
  <text x="800" y="460" text-anchor="middle" class="copy">Rol yetkisine göre modüller görüntülenir</text>
  <path class="connector" d="M800 485v36"/>

  <rect x="40" y="535" width="1520" height="1815" rx="22" fill="#fbfdff" stroke="#8ca6bb" stroke-width="2.2" stroke-dasharray="11 9"/>
  <rect x="68" y="518" width="350" height="36" rx="18" fill="#fff"/>
  <text x="85" y="542" class="section">PORTAL İŞLEMLERİ · UC-02–UC-08</text>

  <path class="branch" d="M800 521v34M194 555h1140"/>
  <path class="connector" d="M194 555v34"/>
  <path class="connector" d="M574 555v34"/>
  <path class="connector" d="M954 555v34"/>
  <path class="connector" d="M1334 555v34"/>

  <rect x="54" y="595" width="280" height="138" rx="17" class="card shadow"/>
  <text x="194" y="625" text-anchor="middle" class="step">UC-02 · Kadro görünümü</text>
  <text x="194" y="652" text-anchor="middle" class="copy">Kadro listesi, arama ve filtreleme</text>
  <text x="194" y="676" text-anchor="middle" class="copy">Durum ve kayıt ayrıntılarını incele</text>
  <text x="194" y="707" text-anchor="middle" class="tiny">Yetki kapsamındaki kayıtlar</text>

  <rect x="434" y="595" width="280" height="138" rx="17" class="card shadow"/>
  <text x="574" y="625" text-anchor="middle" class="step">UC-08 · Raporlama</text>
  <text x="574" y="652" text-anchor="middle" class="copy">Özet, dağılım ve sorumluluk görünümü</text>
  <text x="574" y="676" text-anchor="middle" class="copy">Raporu CSV olarak dışa aktar</text>
  <text x="574" y="707" text-anchor="middle" class="tiny">İK Müdürü · İK Sorumlusu · Admin</text>

  <rect x="814" y="595" width="280" height="138" rx="17" class="amber-card shadow"/>
  <text x="954" y="625" text-anchor="middle" class="step">İK Sorumlusu</text>
  <text x="954" y="652" text-anchor="middle" class="copy">Talep türünü seç</text>
  <text x="954" y="676" text-anchor="middle" class="copy">UC-03 · UC-04 · UC-05</text>
  <text x="954" y="707" text-anchor="middle" class="tiny">Onay için talep oluşturur</text>

  <rect x="1194" y="595" width="280" height="138" rx="17" class="card shadow"/>
  <text x="1334" y="625" text-anchor="middle" class="step">UC-07 · Admin</text>
  <text x="1334" y="652" text-anchor="middle" class="copy">Kadro ünvanı ve hizmet sınıfı</text>
  <text x="1334" y="676" text-anchor="middle" class="copy">Durum kodu / ekstra durum tanımları</text>
  <text x="1334" y="707" text-anchor="middle" class="tiny">Demo arayüzünde tanımları yönetir</text>

  <path class="connector" d="M954 733v61"/>
  <polygon points="954,790 1054,850 954,910 854,850" fill="#fff8e8" stroke="#bf8a13" stroke-width="2.4"/>
  <text x="954" y="845" text-anchor="middle" class="step">İşlem türü</text>
  <text x="954" y="868" text-anchor="middle" class="step">nedir?</text>
  <path class="branch" d="M954 910v35M427 945h1054"/>
  <path class="connector" d="M427 945v38"/>
  <path class="connector" d="M954 945v38"/>
  <path class="connector" d="M1481 945v38"/>

  <rect x="277" y="990" width="300" height="145" rx="18" class="card shadow"/>
  <text x="427" y="1023" text-anchor="middle" class="step">UC-03 · Personel atama</text>
  <text x="427" y="1052" text-anchor="middle" class="copy">Boş kadro ve personel seçilir</text>
  <text x="427" y="1077" text-anchor="middle" class="copy">Atama bilgileri ve zorunlu alanlar</text>
  <text x="427" y="1107" text-anchor="middle" class="tiny">Uygun boş kadro aranır</text>

  <rect x="804" y="990" width="300" height="145" rx="18" class="card shadow"/>
  <text x="954" y="1023" text-anchor="middle" class="step">UC-04 · Kadro bloke</text>
  <text x="954" y="1052" text-anchor="middle" class="copy">Kadro ve bloke miktarı seçilir</text>
  <text x="954" y="1077" text-anchor="middle" class="copy">Tarih ve gerekçe girilir</text>
  <text x="954" y="1107" text-anchor="middle" class="tiny">Boş kadro miktarı aşılmamalı</text>

  <rect x="1331" y="990" width="205" height="145" rx="18" class="card shadow"/>
  <text x="1433" y="1023" text-anchor="middle" class="step">UC-05</text>
  <text x="1433" y="1052" text-anchor="middle" class="copy">Derece</text>
  <text x="1433" y="1077" text-anchor="middle" class="copy">değişikliği</text>
  <text x="1433" y="1107" text-anchor="middle" class="tiny">Yeni derece seçilir</text>

  <path class="branch" d="M427 1135v45h506M954 1135v45M1433 1135v45H975"/>
  <path class="connector" d="M954 1180v27"/>
  <polygon points="954,1205 1090,1280 954,1355 818,1280" fill="#fff8e8" stroke="#bf8a13" stroke-width="2.6"/>
  <text x="954" y="1275" text-anchor="middle" class="step">Alanlar ve</text>
  <text x="954" y="1299" text-anchor="middle" class="step">yetki geçerli mi?</text>

  <path class="approved" d="M954 1355v44"/>
  <text x="973" y="1383" class="small">Evet</text>
  <rect x="779" y="1404" width="350" height="94" rx="18" class="green-card shadow"/>
  <text x="954" y="1440" text-anchor="middle" class="step">Talep onaya gönderilir</text>
  <text x="954" y="1468" text-anchor="middle" class="copy">Durum: Bekliyor · Mevcut kayıt değişmez</text>

  <path class="rejected" d="M818 1280H580"/>
  <text x="693" y="1267" text-anchor="middle" class="small">Hayır · düzelt</text>
  <rect x="300" y="1225" width="280" height="110" rx="17" class="red-card shadow"/>
  <text x="440" y="1264" text-anchor="middle" class="step">Formu düzelt</text>
  <text x="440" y="1292" text-anchor="middle" class="copy">Eksik / geçersiz alanları tamamla</text>
  <path class="dashed" d="M440 1225v-205h-28v-27"/>
  <text x="333" y="1195" class="tiny">Talep formuna dön</text>

  <path class="connector" d="M954 1498v48"/>
  <rect x="779" y="1551" width="350" height="92" rx="18" class="blue-card shadow"/>
  <text x="954" y="1587" text-anchor="middle" class="step">UC-06 · İK Müdürü onay kuyruğu</text>
  <text x="954" y="1616" text-anchor="middle" class="copy">Talep incelenir · Talep sahibi kendi talebini onaylayamaz</text>
  <path class="connector" d="M954 1643v47"/>

  <polygon points="954,1687 1073,1755 954,1823 835,1755" fill="#fff8e8" stroke="#bf8a13" stroke-width="2.6"/>
  <text x="954" y="1750" text-anchor="middle" class="step">Karar</text>
  <text x="954" y="1774" text-anchor="middle" class="step">nedir?</text>

  <path class="approved" d="M1026 1796 1135 1882"/>
  <text x="1090" y="1826" class="small">Onay</text>
  <rect x="1098" y="1880" width="380" height="112" rx="18" class="green-card shadow"/>
  <text x="1288" y="1918" text-anchor="middle" class="step">Güncel kayıt doğrulanır</text>
  <text x="1288" y="1944" text-anchor="middle" class="copy">İşlem uygunsa kadro verisi güncellenir</text>
  <text x="1288" y="1968" text-anchor="middle" class="tiny">Kayıt uygun değilse işlem uygulanmaz</text>
  <path class="approved" d="M1288 1992v38"/>
  <rect x="1120" y="2034" width="336" height="76" rx="18" class="green-card"/>
  <text x="1288" y="2067" text-anchor="middle" class="step">Onaylandı · UC-06</text>
  <text x="1288" y="2090" text-anchor="middle" class="small">Talep durumu güncellenir</text>

  <path class="rejected" d="M882 1796 770 1882"/>
  <text x="799" y="1829" class="small">Ret</text>
  <rect x="350" y="1880" width="420" height="112" rx="18" class="red-card shadow"/>
  <text x="560" y="1918" text-anchor="middle" class="step">Reddedildi · UC-06</text>
  <text x="560" y="1945" text-anchor="middle" class="copy">Talep durumu / varsa ret gerekçesi gösterilir</text>
  <text x="560" y="1969" text-anchor="middle" class="tiny">Mevcut kadro verisi değiştirilmez</text>
  <path class="connector" d="M560 1992v38"/>
  <rect x="350" y="2034" width="420" height="76" rx="18" class="card"/>
  <text x="560" y="2067" text-anchor="middle" class="step">Süreç sonlanır</text>
  <text x="560" y="2090" text-anchor="middle" class="small">İK Sorumlusu yeni talep oluşturabilir</text>

  <path class="connector" d="M1288 2110v44"/>
  <rect x="1120" y="2158" width="336" height="72" rx="18" class="blue-card"/>
  <text x="1288" y="2190" text-anchor="middle" class="step">İşlem tamamlanır</text>
  <text x="1288" y="2213" text-anchor="middle" class="small">Sonuç, role göre görüntülenir</text>

  <path d="M75 2390h1450" stroke="#d6e1e9" stroke-width="1.5"/>
  <text x="800" y="2420" text-anchor="middle" class="small">Prototip kapsamı: demo rol seçimi ve geçici arayüz durumu. Gerçek giriş, veritabanı kalıcılığı ve dış sistem entegrasyonları uygulanmamıştır.</text>
  <rect x="330" y="2440" width="20" height="16" rx="4" fill="#edf7fc" stroke="#2673a6" stroke-width="1.5"/><text x="357" y="2453" class="tiny">İşlem</text>
  <polygon points="454,2440 464,2448 454,2456 444,2448" fill="#fff8e8" stroke="#bf8a13"/><text x="472" y="2453" class="tiny">Karar</text>
  <path d="M553 2448h50" class="connector"/><text x="613" y="2453" class="tiny">Akış yönü</text>
  <path d="M718 2448h48" class="approved"/><text x="775" y="2453" class="tiny">Onay</text>
  <path d="M850 2448h48" class="rejected"/><text x="908" y="2453" class="tiny">Ret / düzeltme</text>
</svg>
