  <rect class="lane" x="48" y="150" width="1904" height="350" rx="18" filter="url(#shadow)"/>
  <path d="M66 150 H1934 Q1952 150 1952 168 V204 H48 V168 Q48 150 66 150" fill="#e8f4f3"/>
  <circle cx="82" cy="177" r="8" fill="#0f766e"/>
  <text x="102" y="183" class="lane-title" fill="#115e59">1 · ADMIN — PARAMETRE TANIMLARI</text>
  <text x="1915" y="182" text-anchor="end" class="small">Sadece Admin ekler ve kaldırır</text>

  <path class="flow-teal" d="M255 345 H310"/>
  <path class="flow-teal" d="M510 345 H560"/>
  <path class="flow-teal" d="M780 345 H830"/>
  <path class="flow-teal" d="M980 315 H1030 V270 H1080"/>
  <path class="flow-teal" d="M980 375 H1030 V425 H1080"/>
