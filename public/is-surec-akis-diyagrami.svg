  <text x="920" y="1317" text-anchor="middle" class="node-copy">Gerekçe ile bildirilebilir</text>

  <rect x="1110" y="1085" width="190" height="80" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="1205" y="1118" text-anchor="middle" class="node-title">İlgililere bildirilir</text>
  <text x="1205" y="1142" text-anchor="middle" class="node-copy">Sonuç görüntülenebilir</text>

  <rect x="1110" y="1260" width="190" height="80" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="1205" y="1293" text-anchor="middle" class="node-title">İlgililere bildirilir</text>
  <text x="1205" y="1317" text-anchor="middle" class="node-copy">Durum / gerekçe görünür</text>

  <rect x="1450" y="1085" width="420" height="150" rx="16" fill="#eff6ff" stroke="#93b4da" stroke-width="1.6"/>
  <text x="1490" y="1123" class="node-title" fill="#1e3a5f">Yetkili kullanıcılar</text>
  <text x="1490" y="1152" class="node-copy">Kadro ve atama kayıtlarını görüntüler,</text>
  <text x="1490" y="1175" class="node-copy">işlem durumunu takip eder.</text>
  <text x="1490" y="1207" class="small">Erişim, kullanıcının rol ve yetkisine bağlıdır.</text>

  <!-- Footer notes -->
  <line x1="64" y1="1422" x2="1936" y2="1422" stroke="#d5dee7" stroke-width="1.2"/>
  <text x="68" y="1452" class="small">Akış özeti: Parametre yönetimi → kadro/atama talebi → sistem doğrulaması → İK Müdürü kararı → durum bildirimi ve kayıt görüntüleme</text>
  <g transform="translate(1470 1438)">
    <rect x="0" y="0" width="20" height="15" rx="4" fill="#fff" stroke="#9db7ca"/><text x="28" y="13" class="small">İşlem</text>
    <polygon points="105,0 115,7 105,14 95,7" fill="#fff7ed" stroke="#ea8a39"/><text x="122" y="13" class="small">Karar</text>
    <path d="M205 7 H237" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="246" y="13" class="small">Akış yönü</text>
  </g>
</svg>
