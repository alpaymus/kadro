<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">UC-01 — Kurum SSO ile giriş sıralama diyagramı</title>
<desc id="desc">Kullanıcı, uygulama, SSO entegrasyonu, kurum kimlik sağlayıcısı, kimlik ve rol eşleme katmanı ve oturum servisi arasındaki başarılı ve başarısız SSO etkileşimi. Protokol kararı açık bırakılmıştır.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#34536f" stroke-width="1.5"/></marker>
<marker id="reply" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#718297" stroke-width="1.5"/></marker>
<style>
.bg{fill:#f5f8fc}.head{font:700 25px Arial,sans-serif;fill:#18324b}.sub{font:15px Arial,sans-serif;fill:#526879}.participant{fill:#fff;stroke:#8ca2b7;stroke-width:1.5}.frame{fill:#fff;fill-opacity:.46;stroke:#627c96;stroke-width:1.5}.framehead{fill:#e9eff6;stroke:#627c96;stroke-width:1.2}.life{stroke:#9aabbb;stroke-width:1.5;stroke-dasharray:7 6}.activation{fill:#e2edf7;stroke:#55728e;stroke-width:1.2}.msg{stroke:#34536f;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.ret{stroke:#718297;stroke-width:1.6;stroke-dasharray:7 5;fill:none;marker-end:url(#reply)}.txt{font:14px Arial,sans-serif;fill:#243c52}.small{font:12.5px Arial,sans-serif;fill:#526879}.strong{font-weight:700}.note{fill:#fff3dd;stroke:#c27a16;stroke-width:1.4}
</style></defs>
<rect class="bg" width="1600" height="980"/>
<text class="head" x="48" y="48">UC-01 · Kurum SSO’su ile sisteme giriş</text>
<text class="sub" x="48" y="76">UML 2.5.1 · Sıralama diyagramı · Başarılı oturum ve erişim reddi alternatifleri</text>
<g class="participant"><rect x="45" y="110" width="170" height="60" rx="6"/><rect x="305" y="110" width="170" height="60" rx="6"/><rect x="565" y="110" width="170" height="60" rx="6"/><rect x="825" y="110" width="170" height="60" rx="6"/><rect x="1085" y="110" width="170" height="60" rx="6"/><rect x="1345" y="110" width="170" height="60" rx="6"/></g>
<g class="txt" text-anchor="middle"><text x="130" y="137">Kullanıcı</text><text class="small" x="130" y="156">«actor»</text><text x="390" y="137">İK Yönetim Sistemi</text><text class="small" x="390" y="156">«boundary»</text><text x="650" y="137">SSO entegrasyonu</text><text class="small" x="650" y="156">«control»</text><text x="910" y="137">Kurum IdP</text><text class="small" x="910" y="156">«external system»</text><text x="1170" y="137">Kimlik / rol eşleme</text><text class="small" x="1170" y="156">«entity»</text><text x="1430" y="137">Oturum servisi</text><text class="small" x="1430" y="156">«control»</text></g>
<g class="life"><path d="M130 170V820"/><path d="M390 170V820"/><path d="M650 170V820"/><path d="M910 170V820"/><path d="M1170 170V820"/><path d="M1430 170V820"/></g>
<g class="activation"><rect x="384" y="268" width="12" height="390"/><rect x="644" y="308" width="12" height="340"/><rect x="904" y="382" width="12" height="68"/><rect x="1164" y="458" width="12" height="65"/><rect x="1424" y="548" width="12" height="60"/></g>
<rect class="frame" x="270" y="220" width="1265" height="570" rx="3"/><rect class="framehead" x="270" y="220" width="70" height="28"/><text class="txt strong" x="282" y="239">alt</text><path d="M270 674H1535" stroke="#718297" stroke-width="1.2" stroke-dasharray="8 5"/>
<text class="small strong" x="350" y="264">[SSO yanıtı geçerli, kullanıcı etkin ve rol eşlemesi mevcut]</text>
<path class="msg" d="M130 290H390"/><text class="txt" x="260" y="282" text-anchor="middle">“Kurum hesabıyla giriş” seç</text>
<path class="msg" d="M390 330H650"/><text class="txt" x="520" y="322" text-anchor="middle">SSO başlat; state/nonce üret</text>
<path class="msg" d="M650 370H910"/><text class="txt" x="780" y="362" text-anchor="middle">Kimlik doğrulama isteği</text>
<path class="msg" d="M910 410H650"/><text class="txt" x="780" y="402" text-anchor="middle">Doğrulanmış IdP yanıtı</text>
<path class="msg" d="M650 450H1170"/><text class="txt" x="910" y="442" text-anchor="middle">İmza, issuer/audience, istek korelasyonu ve süreyi doğrula</text>
<path class="ret" d="M1170 490H650"/><text class="txt" x="910" y="482" text-anchor="middle">Değişmez kurum kimliği, etkinlik, uygulama rolü</text>
<path class="msg" d="M650 530H1430"/><text class="txt" x="1040" y="522" text-anchor="middle">Güvenli uygulama oturumu oluştur(özne, rol)</text>
<path class="ret" d="M1430 570H390"/><text class="txt" x="910" y="562" text-anchor="middle">Oturum tanımlayıcısı ve rol bağlamı</text>
<path class="ret" d="M390 620H130"/><text class="txt" x="260" y="612" text-anchor="middle">Yetkili iş masasına yönlendir</text>
<text class="small strong" x="350" y="704">[İptal, geçersiz yanıt, kapalı hesap, rol yok veya IdP kullanılamıyor]</text>
<path class="ret" d="M650 738H390"/><text class="txt" x="520" y="730" text-anchor="middle">Oturum oluşturma; genel erişim hatası</text>
<path class="ret" d="M390 770H130"/><text class="txt" x="260" y="762" text-anchor="middle">Erişim reddedildi; korumalı alan açılmaz</text>
<rect class="note" x="48" y="850" width="1504" height="76" rx="8"/><text class="txt strong" x="68" y="878">Güvenlik ve karar notları</text><text class="small" x="68" y="901">Yerel parola alınmaz/saklanmaz. İmza ve SSO yanıtı doğrulanır; hassas claim/token loglanmaz. Protokol (OIDC/SAML), MFA, claim eşlemesi ve IdP logout/oturum politikası OPEN-02–04 kapsamındadır.</text>
</svg>
