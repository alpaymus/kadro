  <path class="flow-green" d="M710 1125 H825"/>
  <path class="flow-red" d="M635 1170 V1300 H825"/>
  <path class="flow-green" d="M1015 1125 H1110"/>
  <path class="flow-red" d="M1015 1300 H1110"/>
  <path class="flow" d="M1300 1125 H1450"/>

