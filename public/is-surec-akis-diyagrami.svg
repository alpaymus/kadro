  <text x="185" y="1212" text-anchor="middle" class="node-copy">İK Müdürü talep listesi</text>

  <rect x="330" y="1155" width="150" height="80" rx="14" fill="#fff" stroke="#b8a9d5" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="405" y="1188" text-anchor="middle" class="node-title">Talebi inceler</text>
  <text x="405" y="1212" text-anchor="middle" class="node-copy">Bilgileri değerlendirir</text>

  <polygon points="635,1080 710,1125 635,1170 560,1125" fill="#fff7ed" stroke="#ea8a39" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="1121" text-anchor="middle" font-size="13" font-weight="700">Karar</text>
  <text x="635" y="1140" text-anchor="middle" font-size="13" font-weight="700">nedir?</text>
  <text x="725" y="1110" class="branch" fill="#15803d">ONAY</text>
  <text x="725" y="1319" class="branch" fill="#be123c">RET</text>

  <rect x="825" y="1085" width="190" height="80" rx="14" fill="#ecfdf5" stroke="#86c9a0" stroke-width="1.6"/>
  <text x="920" y="1118" text-anchor="middle" class="node-title" fill="#166534">Onaylandı</text>
  <text x="920" y="1142" text-anchor="middle" class="node-copy">Kayıt durumu güncellenir</text>

  <rect x="825" y="1260" width="190" height="80" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="1.6"/>
