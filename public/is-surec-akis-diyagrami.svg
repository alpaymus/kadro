<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="1480" viewBox="0 0 2000 1480" role="img" aria-labelledby="title description">
  <title id="title">Kadro ve Personel Atama İş/Süreç Akış Diyagramı</title>
  <desc id="description">Admin'in kadro ünvanı, hizmet sınıfı, durum kodu ve ekstra durum tanımlarını yönetmesinden; İK Sorumlusunun kadro veya personel atama talebi oluşturmasına, sistem doğrulamasına ve İK Müdürünün onay veya ret kararına kadar süreci gösterir.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/></filter>
    <style>
      text { font-family: Arial, "DejaVu Sans", sans-serif; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
      .subtitle { font-size: 16px; fill: #475569; }
      .lane-title { font-size: 17px; font-weight: 700; letter-spacing: 1.3px; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-copy { font-size: 13px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .branch { font-size: 12px; font-weight: 700; fill: #475569; }
      .lane { fill: #fff; stroke: #dbe4ec; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .flow-teal { fill: none; stroke: #0f766e; stroke-width: 2.5; marker-end: url(#arrow-teal); stroke-linecap: round; stroke-linejoin: round; }
      .flow-green { fill: none; stroke: #15803d; stroke-width: 2.5; marker-end: url(#arrow-green); stroke-linecap: round; stroke-linejoin: round; }
      .flow-red { fill: none; stroke: #be123c; stroke-width: 2.5; marker-end: url(#arrow-red); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="2000" height="1480" fill="#f4f7fa"/>
  <rect x="0" y="0" width="2000" height="125" fill="#0b2538"/>
  <rect x="0" y="119" width="2000" height="6" fill="#0f766e"/>
  <text x="64" y="58" class="title" fill="#ffffff">İş / Süreç Akış Diyagramı</text>
  <text x="66" y="91" class="subtitle" fill="#cbd5e1">Kadro yönetimi · Personel atama · Sistem parametreleri · Onay süreci</text>
  <rect x="1620" y="37" width="316" height="48" rx="24" fill="#173b50" stroke="#2a5366"/>
  <text x="1778" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#d8e8ee">ROLLER: ADMIN · İK SORUMLUSU · İK MÜDÜRÜ</text>

