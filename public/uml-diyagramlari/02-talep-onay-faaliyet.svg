<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1280" role="img" aria-labelledby="title desc">
<title id="title">Kadro talebi ve onay — UML Faaliyet Diyagramı</title><desc id="desc">İK Sorumlusunun talep hazırlaması, sistemin doğrulaması, İK Müdürünün farklı bir talep sahibi olarak incelemesi, kaynak kaydını yeniden doğrulaması ve onay veya ret kararı vermesini gösteren üç bölümlü UML faaliyet diyagramı.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker><style>.bg{fill:#f5f8fc}.lane{fill:#fff;stroke:#b7c7d8;stroke-width:1.5}.lanehead{fill:#eaf3fb;stroke:#b7c7d8;stroke-width:1.5}.action{fill:#edf5fb;stroke:#246b91;stroke-width:1.8}.decision{fill:#fff3dd;stroke:#c27a16;stroke-width:1.8}.final{fill:#fff;stroke:#18324b;stroke-width:2.5}.flow{fill:none;stroke:#52657a;stroke-width:1.7;marker-end:url(#a)}.txt{font:15px Arial,sans-serif;fill:#18324b}.small{font:13px Arial,sans-serif;fill:#52657a}.head{font:700 25px Arial,sans-serif;fill:#18324b}.sub{font:15px Arial,sans-serif;fill:#52657a}.bold{font-weight:700}</style></defs>
<rect class="bg" width="1500" height="1280"/><text class="head" x="55" y="52">Kadro talebi → onay kararı · Faaliyet diyagramı</text><text class="sub" x="55" y="80">UML 2.5.1 · Activity / partition · Hata, yetki, karar ve kaynak çakışması akışları</text>
<rect class="lane" x="55" y="120" width="460" height="1100"/><rect class="lane" x="515" y="120" width="480" height="1100"/><rect class="lane" x="995" y="120" width="450" height="1100"/><rect class="lanehead" x="55" y="120" width="460" height="54"/><rect class="lanehead" x="515" y="120" width="480" height="54"/><rect class="lanehead" x="995" y="120" width="450" height="54"/>
<g class="txt bold" text-anchor="middle"><text x="285" y="154">İK Sorumlusu</text><text x="755" y="154">İK Yönetim Sistemi</text><text x="1220" y="154">İK Müdürü</text></g>
<!-- Control-flow connectors are behind the actions. -->
<g class="flow"><path d="M285 217V255"/><path d="M285 321V355"/><path d="M430 388H545"/><path d="M755 423V455"/><path d="M755 521V552"/><path d="M675 488H530V693H545"/><path d="M545 693H490V388H430"/><path d="M935 590H1040"/><path d="M1155 626V670"/><path d="M1075 706H970V793H935"/><path d="M1155 742V790"/><path d="M1155 862V895"/><path d="M1075 931H970V918H935"/><path d="M1235 931H1300V1028H1270"/><path d="M755 946V970"/><path d="M755 1036V1050"/><path d="M825 1003H900V1084H780"/><path d="M645 1118V1145"/><path d="M875 1118V1145"/><path d="M1155 1060V1100"/><path d="M755 836V853"/></g>
<circle cx="285" cy="205" r="12" fill="#18324b"/>
<rect class="action" x="140" y="255" width="290" height="66" rx="18"/><text class="txt" x="285" y="282" text-anchor="middle"><tspan x="285">Talep türünü ve hedef</tspan><tspan x="285" dy="20">kadro kaydını seç</tspan></text>
<rect class="action" x="140" y="355" width="290" height="66" rx="18"/><text class="txt" x="285" y="382" text-anchor="middle"><tspan x="285">Alanları doldur ve</tspan><tspan x="285" dy="20">talebi gönder</tspan></text>
<rect class="action" x="545" y="355" width="390" height="68" rx="18"/><text class="txt" x="740" y="383" text-anchor="middle"><tspan x="740">Zorunlu alanları ve iş kurallarını doğrula</tspan><tspan x="740" dy="20">(miktar, kapasite, derece, tarih / gerekçe)</tspan></text>
<path class="decision" d="M755 455L835 488L755 521L675 488Z"/><text class="txt" text-anchor="middle"><tspan x="755" y="484">Talep</tspan><tspan x="755" y="502">geçerli mi?</tspan></text><text class="small" x="765" y="542">[evet]</text><text class="small" x="537" y="480">[hayır]</text>
<rect class="action" x="545" y="552" width="390" height="76" rx="18"/><text class="txt" x="740" y="581" text-anchor="middle"><tspan x="740">Talebi bekleyen duruma al</tspan><tspan x="740" dy="20">ve onay kuyruğuna ekle</tspan></text>
<rect class="action" x="545" y="660" width="390" height="66" rx="18"/><text class="txt" x="740" y="687" text-anchor="middle"><tspan x="740">Alan hatalarını göster;</tspan><tspan x="740" dy="20">talep oluşturma</tspan></text>
<rect class="action" x="1040" y="552" width="230" height="74" rx="18"/><text class="txt" x="1155" y="581" text-anchor="middle"><tspan x="1155">Bekleyen talebi</tspan><tspan x="1155" dy="20">incele</tspan></text>
<path class="decision" d="M1155 670L1235 706L1155 742L1075 706Z"/><text class="txt" text-anchor="middle"><tspan x="1155" y="702">Karar yetkisi</tspan><tspan x="1155" y="720">geçerli mi?</tspan></text><text class="small" x="1165" y="772">[evet]</text><text class="small" x="1010" y="693">[hayır]</text>
<rect class="action" x="545" y="760" width="390" height="76" rx="18"/><text class="txt" x="740" y="789" text-anchor="middle"><tspan x="740">Kararı engelle; talep sahibi</tspan><tspan x="740" dy="20">kendi talebini onaylayamaz</tspan></text><circle class="final" cx="755" cy="870" r="15"/><circle cx="755" cy="870" r="9" fill="#18324b"/>
<rect class="action" x="1040" y="790" width="230" height="72" rx="18"/><text class="txt" x="1155" y="819" text-anchor="middle"><tspan x="1155">Talep ayrıntılarını</tspan><tspan x="1155" dy="20">incele ve karar ver</tspan></text>
<path class="decision" d="M1155 895L1235 931L1155 967L1075 931Z"/><text class="txt" text-anchor="middle"><tspan x="1155" y="927">Karar</tspan><tspan x="1155" y="945">nedir?</tspan></text><text class="small" x="1005" y="916">[onay]</text><text class="small" x="1240" y="916">[ret]</text>
<rect class="action" x="545" y="885" width="390" height="66" rx="18"/><text class="txt" x="740" y="913" text-anchor="middle"><tspan x="740">Onay anında kapasite ve</tspan><tspan x="740" dy="20">kaynak kaydını yeniden doğrula</tspan></text>
<path class="decision" d="M755 970L825 1003L755 1036L685 1003Z"/><text class="txt" text-anchor="middle"><tspan x="755" y="1000">Kaynak güncel</tspan><tspan x="755" y="1018">mi?</tspan></text><text class="small" x="690" y="1047">[evet]</text><text class="small" x="843" y="996">[hayır]</text>
<rect class="action" x="535" y="1050" width="220" height="68" rx="18"/><text class="txt" x="645" y="1078" text-anchor="middle"><tspan x="645">İşlemi uygula;</tspan><tspan x="645" dy="20">kararı kaydet</tspan></text><rect class="action" x="780" y="1050" width="220" height="68" rx="18"/><text class="txt" x="890" y="1078" text-anchor="middle"><tspan x="890">Çakışmayı kaydet;</tspan><tspan x="890" dy="20">talebi uygulama</tspan></text>
<circle class="final" cx="645" cy="1160" r="15"/><circle cx="645" cy="1160" r="9" fill="#18324b"/><circle class="final" cx="890" cy="1160" r="15"/><circle cx="890" cy="1160" r="9" fill="#18324b"/>
<rect class="action" x="1040" y="995" width="230" height="66" rx="18"/><text class="txt" x="1155" y="1023" text-anchor="middle"><tspan x="1155">Ret gerekçesini</tspan><tspan x="1155" dy="20">ve kararı kaydet</tspan></text><circle class="final" cx="1155" cy="1115" r="15"/><circle cx="1155" cy="1115" r="9" fill="#18324b"/>
<g class="small"><text x="645" y="1190" text-anchor="middle">Onaylandı</text><text x="890" y="1190" text-anchor="middle">Çakışma — uygulanmadı</text><text x="1175" y="1120">Reddedildi</text></g><text class="small" x="55" y="1252">Not: Kesin zorunlu alanlar ve ret / yeniden gönderim politikası iş sahibi onayına tabidir. Oklar kontrol akışını gösterir.</text>
</svg>
